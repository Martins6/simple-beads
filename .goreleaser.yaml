# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: sb

before:
  hooks:
    - go mod tidy

builds:
  - id: sb
    main: .
    binary: sb
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
      - -X main.builtBy=goreleaser

archives:
  - id: sb
    builds:
      - sb
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  footer: |
    Install via Homebrew:
      brew install Martins6/tap/sb

    Or download a binary directly from the assets above.

brews:
  - name: sb
    repository:
      owner: Martins6
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Martins6/simple-beads"
    description: "Lightweight, local-only task management CLI"
    license: MIT
    dependencies:
      - name: go
        type: build
    test: |
      system "#{bin}/sb", "init"
      system "#{bin}/sb", "create", "tap-test"
      assert_match "tap-test", shell_output("#{bin}/sb list")